spring:
  application:
    name: report-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888/}
  jpa:
    hibernate:
      ddl-auto: create-drop
  sql:
    init:
      mode: never

server:
  port: 8087

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    preferIpAddress: true

---
spring:
  config:
    activate:
      on-profile: docker
    import: configserver:http://config-server:8888